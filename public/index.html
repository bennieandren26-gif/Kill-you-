<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>GRoUpKh6r#91 - Control Panel</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: monospace; }
        body { background: #0a0a0a; color: #00ff66; padding: 20px; }
        h1 { text-align: center; border-bottom: 2px solid #00ff66; padding-bottom: 10px; margin-bottom: 20px; font-size: 24px; text-shadow: 0 0 10px rgba(0,255,102,0.5); }
        .panel { background: #121212; border: 1px solid #00ff66; padding: 20px; margin-bottom: 20px; border-radius: 4px; box-shadow: 0 0 15px rgba(0,255,102,0.1); }
        label { display: block; margin-top: 10px; color: #fff; font-size: 14px; }
        input, select, textarea { width: 100%; padding: 10px; background: #1a1a1a; border: 1px solid #333; color: #00ff66; margin-top: 5px; border-radius: 3px; }
        input:focus { border-color: #00ff66; outline: none; box-shadow: 0 0 5px rgba(0,255,102,0.5); }
        button { background: #00ff66; color: #000; border: none; padding: 12px; width: 100%; margin-top: 15px; font-weight: bold; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; transition: 0.2s; }
        button:hover { background: #00cc52; box-shadow: 0 0 10px #00ff66; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; }
        .card { background: #181818; border: 1px solid #222; padding: 15px; border-radius: 4px; }
        .card h3 { color: #fff; font-size: 16px; margin-bottom: 10px; border-bottom: 1px dashed #333; padding-bottom: 5px; }
        #console { background: #000; border: 1px solid #00ff66; padding: 15px; height: 180px; overflow-y: scroll; color: #00ff66; font-size: 12px; margin-top: 20px; }
        .audio-box { text-align: center; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="audio-box">
        <!-- راب درب المهالك - كلاش -->
        <iframe width="0" height="0" src="https://www.youtube.com/embed/BdXFz8ESpLc?autoplay=1&loop=1&playlist=BdXFz8ESpLc" frameborder="0" allow="autoplay"></iframe>
    </div>

    <h1>[ GRoUpKh6r#91 ] DISCORD ASSAULT PANEL</h1>

    <div class="panel">
        <label>Authentication Token (Bot / User Token):</label>
        <input type="password" id="token" placeholder="أدخل توكن الحساب أو البوت هنا">
        <label>Target Server ID:</label>
        <input type="text" id="guild_id" placeholder="أيدي السيرفر المستهدف">
    </div>

    <div class="grid">
        <div class="card">
            <h3>Structure Ops</h3>
            <label>Name (Channels / Roles):</label>
            <input type="text" id="target_name" value="GRoUpKh6r">
            <label>Count:</label>
            <input type="number" id="count" value="50">
            <button onclick="execute('create_channels')">إنشاء رومات</button>
            <button onclick="execute('create_roles')">إنشاء رولات</button>
            <button onclick="execute('delete_channels')">حذف جميع الرومات</button>
            <button onclick="execute('delete_roles')">حذف جميع الرولات</button>
        </div>

        <div class="card">
            <h3>Server & Members</h3>
            <label>New Server Name:</label>
            <input type="text" id="server_name" value="GRoUpKh6r Raided">
            <button onclick="execute('rename_server')">تعديل اسم السيرفر</button>
            <label>Members Target Name:</label>
            <input type="text" id="member_name" value="GRoUpKh6r Slaved">
            <button onclick="execute('rename_members')">تعديل اسماء جميع الاعضاء</button>
            <button onclick="execute('kick_all')">طرد جميع الاعضاء</button>
            <button onclick="execute('ban_all')">باند جميع الاعضاء</button>
        </div>

        <div class="card">
            <h3>Webhooks & Hyper-Spam</h3>
            <label>Spam Message Payload:</label>
            <textarea id="spam_msg" rows="2">@everyone GRoUpKh6r#91 ON TOP</textarea>
            <label>Webhook Name:</label>
            <input type="text" id="wh_name" value="GRoUpKh6r Spam">
            <button onclick="execute('create_webhooks')">إنشاء ويبهوكات بكل الرومات</button>
            <button onclick="execute('start_spam')">بدء السبام (لا ينتهي)</button>
            <button onclick="execute('stop_spam')">إيقاف السبام</button>
        </div>
    </div>

    <div id="console">[+] Panel initialized. Waiting for execution command...</div>

    <script>
        function log(text) {
            const c = document.getElementById('console');
            c.innerHTML += "<br>" + text;
            c.scrollTop = c.scrollHeight;
        }

        async function execute(action) {
            const token = document.getElementById('token').value;
            const guild_id = document.getElementById('guild_id').value;
            const target_name = document.getElementById('target_name').value;
            const count = document.getElementById('count').value;
            const server_name = document.getElementById('server_name').value;
            const member_name = document.getElementById('member_name').value;
            const spam_msg = document.getElementById('spam_msg').value;
            const wh_name = document.getElementById('wh_name').value;

            if(!token || !guild_id) {
                log("[!] Error: Token and Guild ID are required.");
                return;
            }

            log("[~] Executing command: " + action + "...");

            try {
                const response = await fetch('/api/execute', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({action, token, guild_id, target_name, count, server_name, member_name, spam_msg, wh_name})
                });
                const res = await response.json();
                log("[>] " + res.status);
            } catch (err) {
                log("[!] Connection Error: Failed to reach server.");
            }
        }
    </script>
</body>
</html>
