<!-- language: HTML, file: public/index.html, target: Browser -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>GRoUpKh6r#91 | Nuke & Control Center</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: #07090e; color: #f3f4f6; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        header { text-align: center; margin-bottom: 25px; border-bottom: 2px solid #1f2937; width: 100%; max-width: 950px; padding-bottom: 15px; }
        h1 { color: #ef4444; font-size: 28px; text-shadow: 0 0 12px rgba(239, 68, 68, 0.5); }
        .watermark { color: #9ca3af; font-size: 14px; margin-top: 5px; }
        .container { width: 100%; max-width: 950px; background: #111827; border: 1px solid #1f2937; border-radius: 12px; padding: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.6); }
        .section { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #93c5fd; font-size: 14px; }
        input, select, textarea { width: 100%; padding: 12px; background: #1f2937; border: 1px solid #374151; border-radius: 8px; color: #fff; margin-bottom: 15px; font-size: 14px; }
        input:focus, textarea:focus { border-color: #ef4444; outline: none; box-shadow: 0 0 8px rgba(239, 68, 68, 0.4); }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .btn-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-top: 15px; }
        button { background: #1f2937; color: #fff; border: 1px solid #374151; padding: 14px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s; text-align: center; }
        button:hover { background: #ef4444; border-color: #dc2626; transform: translateY(-2px); box-shadow: 0 4px 15px rgba(239, 68, 68, 0.5); }
        .danger-btn { background: #7f1d1d; border-color: #991b1b; }
        .danger-btn:hover { background: #991b1b; }
        #console { background: #030712; border: 1px solid #1f2937; border-radius: 8px; padding: 15px; height: 220px; overflow-y: auto; font-family: monospace; font-size: 12px; color: #4ade80; margin-top: 20px; }
        audio { width: 100%; margin-top: 10px; border-radius: 8px; }
    </style>
</head>
<body>

    <header>
        <h1>GRoUpKh6r#91 Ultimate Control Panel</h1>
        <div class="watermark">Designed for dj | High-Speed Token & Nuke Engine</div>
    </header>

    <div class="container">
        <!-- مشغل الموسيقى الحماسي (راب درب مهالك / بديل مضمون) -->
        <div class="section">
            <label>مشغل الأغنية الحماسية (درب مهالك / راب)</label>
            <audio controls autoplay loop>
                <!-- رابط مباشر مضمّن يشتغل فوراً دون مشاكل حظر يوتيوب -->
                <source src="https://cdns.us.streamaudio.com:8243/stream" type="audio/mp4">
                <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-16.mp3" type="audio/mpeg">
                متصفحك لا يدعم مشغل الصوت.
            </audio>
        </div>

        <div class="grid">
            <div class="section">
                <label>Token Type (نوع التوكن)</label>
                <select id="tokenType">
                    <option value="Bot">Bot Token</option>
                    <option value="User">User Token (Account)</option>
                </select>
            </div>
            <div class="section">
                <label>Discord Token (توكن الحساب أو البوت)</label>
                <input type="password" id="token" placeholder="أدخل التوكن هنا...">
            </div>
        </div>

        <div class="section">
            <label>Server ID (أيدي السيرفر المستهدف)</label>
            <input type="text" id="guildId" placeholder="123456789012345678">
        </div>

        <div class="grid">
            <div class="section">
                <label>Target Name (اسم الرومات، الرتب، الأعضاء، السيرفر)</label>
                <input type="text" id="targetName" value="vanta-nuke-x">
            </div>
            <div class="section">
                <label>Webhook Name (اسم الويب هوك للسبام)</label>
                <input type="text" id="webhookName" value="GRoUpKh6r-Spam">
            </div>
        </div>

        <div class="section">
            <label>Spam Payload Message (رسالة السبام التي لا تتوقف)</label>
            <textarea id="spamMessage" rows="2">@everyone https://discord.gg/vanta-nuke-x GRoUpKh6r#91 ON TOP</textarea>
        </div>

        <label>Control Commands (الأوامر السريعة بالإنجليزية)</label>
        <div class="btn-grid">
            <button onclick="runAction('execute_all')" class="danger-btn">⚡ LAUNCH FULL NUKE (تنفيذ شامل)</button>
            <button onclick="runAction('create_channels')">Create Channels</button>
            <button onclick="runAction('delete_channels')" class="danger-btn">Delete All Channels</button>
            <button onclick="runAction('create_roles')">Create Roles</button>
            <button onclick="runAction('delete_roles')" class="danger-btn">Delete All Roles</button>
            <button onclick="runAction('rename_server')">Rename Server</button>
            <button onclick="runAction('rename_members')" class="danger-btn">Rename All Members</button>
            <button onclick="runAction('ban_all')" class="danger-btn">Ban All Members</button>
            <button onclick="runAction('kick_all')" class="danger-btn">Kick All Members</button>
        </div>

        <div id="console">[7bl] System ready. Group: GRoUpKh6r#91. Awaiting command execution...</div>
    </div>

    <script>
        function log(text) {
            const c = document.getElementById('console');
            c.innerHTML += `\n[${new Date().toLocaleTimeString()}] ${text}`;
            c.scrollTop = c.scrollHeight;
        }

        async function runAction(action) {
            const token = document.getElementById('token').value.trim();
            const tokenType = document.getElementById('tokenType').value;
            const guildId = document.getElementById('guildId').value.trim();
            const targetName = document.getElementById('targetName').value;
            const webhookName = document.getElementById('webhookName').value;
            const spamMessage = document.getElementById('spamMessage').value;

            if(!token || !guildId) {
                alert('الرجاء إدخال التوكن وأيدي السيرفر أولاً!');
                return;
            }

            log(`Executing [${action}] with target name: "${targetName}"...`);
            
            try {
                const res = await fetch('/api/execute', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, tokenType, guildId, targetName, webhookName, spamMessage })
                });
                const data = await res.json();
                if(data.success) {
                    log(`[SUCCESS] ${data.message}`);
                } else {
                    log(`[ERROR] ${data.error}`);
                }
            } catch(e) {
                log(`[FAIL] Connection error: ${e.message}`);
            }
        }
    </script>
</body>
</html>
