<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GRoUpKh6r#91 - Supreme Nuke Panel</title>
    <style>
        body { background: #050505; color: #00ffcc; font-family: monospace; text-align: center; margin: 0; padding: 10px; }
        .welcome-banner { background: #111; border: 1px solid #ff0055; padding: 12px; margin: 10px auto; max-width: 500px; border-radius: 6px; box-shadow: 0 0 15px rgba(255,0,85,0.2); }
        .welcome-banner h2 { color: #ff0055; margin: 0 0 5px 0; font-size: 18px; }
        .welcome-banner p { color: #fff; margin: 0; font-size: 13px; }
        
        .skull { color: #ff0055; font-size: 18px; font-weight: bold; text-shadow: 0 0 10px #ff0055; margin-top: 10px; white-space: pre; }
        .container { max-width: 500px; margin: 0 auto; background: #0c0c0c; border: 1px solid #222; padding: 15px; border-radius: 8px; box-shadow: 0 0 15px rgba(0,255,204,0.1); }
        
        .token-type-selector {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 10px 0;
            background: #111;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #333;
        }
        .token-type-selector label { cursor: pointer; font-weight: bold; color: #fff; font-size: 14px; }
        .token-type-selector input[type="radio"] { accent-color: #00ffcc; margin-right: 5px; }

        input { width: 90%; background: #030303; color: #00ffcc; border: 1px solid #333; padding: 10px; margin: 6px 0; border-radius: 4px; outline: none; box-sizing: border-box; }
        
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
        button { width: 100%; background: #151515; color: #00ffcc; border: 1px solid #00ffcc; padding: 10px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 11px; transition: 0.2s; }
        button:hover { background: #00ffcc; color: #000; box-shadow: 0 0 10px #00ffcc; }
        button.danger { border-color: #ff0055; color: #ff0055; grid-column: span 2; }
        button.danger:hover { background: #ff0055; color: #000; box-shadow: 0 0 10px #ff0055; }
        
        #log { margin-top: 15px; color: #ff0055; font-size: 13px; word-break: break-all; min-height: 25px; background: #030303; padding: 8px; border-radius: 4px; border: 1px solid #222; }
        .rights { color: #888; font-size: 12px; margin: 10px 0; }
    </style>
</head>
<body>
    <div class="welcome-banner">
        <h2>Welcome to GRoUpKh6r Portal</h2>
        <p>مرحباً بك يا وحش، أدخل بياناتك وتحكم بكل شيء بضغطة زر وبأقصى سرعة!</p>
    </div>

    <div class="skull">
      ____---____
    /             \
   |   /\     /\   |
   |   ~~     ~~   |
   |      ---      |
    \  ____  /
     \_______/
    </div>
    <div class="rights">GRoUpKh6r#91 - Supreme Control Panel</div>
    
    <!-- أغنية درب المهالك لـ كلاش (مع تكرار تلقائي loop) -->
    <audio id="bgAudio" src="https://www.youtube.com/watch?v=BdXFz8ESpLc" loop></audio>

    <div class="container">
        <div class="token-type-selector">
            <label><input type="radio" name="tokenType" value="user" checked> User Token</label>
            <label><input type="radio" name="tokenType" value="bot"> Bot Token</label>
        </div>

        <input type="password" id="token" placeholder="Enter Token Here"><br>
        <input type="text" id="guildId" placeholder="Enter Target Server ID"><br>
        <input type="text" id="customName" placeholder="Custom Name / Spam Text"><br>
        
        <div class="btn-grid">
            <button class="danger" onclick="runCmd('nuke_all')">TOTAL_NUKE</button>
            <button onclick="runCmd('create_channels')">CREATE_CHANNELS</button>
            <button onclick="runCmd('delete_channels')">DELETE_CHANNELS</button>
            <button onclick="runCmd('create_roles')">CREATE_ROLES</button>
            <button onclick="runCmd('delete_roles')">DELETE_ROLES</button>
            <button onclick="runCmd('rename_channels')">RENAME_CHANNELS</button>
            <button onclick="runCmd('rename_roles')">RENAME_ROLES</button>
            <button onclick="runCmd('rename_server')">RENAME_SERVER</button>
            <button onclick="runCmd('rename_members')">RENAME_MEMBERS</button>
            <button class="danger" onclick="runCmd('ban_members')">BAN_ALL_MEMBERS</button>
            <button class="danger" onclick="runCmd('kick_members')">KICK_ALL_MEMBERS</button>
            <button onclick="runCmd('create_webhooks')">CREATE_WEBHOOKS</button>
            <button class="danger" onclick="runCmd('webhook_spam')">START_WEBHOOK_SPAM</button>
            <button onclick="runCmd('stop_spam')">STOP_SPAM</button>
        </div>
        
        <div id="log">Status: Idle</div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        
        // تشغيل الموسيقى وتكرارها بلا توقف
        const audio = document.getElementById('bgAudio');
        audio.play().catch(() => {});
        document.addEventListener('click', () => { audio.play(); }, { once: true });

        function runCmd(action) {
            const tokenType = document.querySelector('input[name="tokenType"]:checked').value;
            const token = document.getElementById('token').value;
            const guildId = document.getElementById('guildId').value;
            const customName = document.getElementById('customName').value;
            
            if(!token || !guildId) {
                document.getElementById('log').innerText = "[!] Please enter Token and Server ID";
                return;
            }

            document.getElementById('log').innerText = "[*] Executing...";
            socket.emit('execute_action', { tokenType, token, guildId, action, customName, spamText: customName });
        }

        socket.on('status', (data) => {
            document.getElementById('log').innerText = data.msg;
        });
    </script>
</body>
</html>
