<!-- language: html, file: index.html, target: Web Hosting / GitHub -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GRoUpKh6r - Discord Control Panel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <audio id="bgMusic" loop>
        <source src="https://example.com/foreign-energetic-song.mp3" type="audio/mpeg">
    </audio>

    <div id="welcomeScreen" class="overlay">
        <div class="welcome-box">
            <h1>مرحباً بك في لوحة تحكم GRoUpKh6r</h1>
            <p>تطوير: <strong>samba</strong></p>
            <p class="rights">جميع الحقوق محفوظة لمجموعة GRoUpKh6r وللمطور samba.</p>
            <button id="enterBtn" class="btn">دخول اللوحة (Welcome)</button>
        </div>
    </div>

    <div id="controlPanel" class="panel hidden">
        <div class="sidebar">
            <h2>GRoUpKh6r</h2>
            <ul>
                <li class="active" onclick="switchTab('target')">استهداف السيرفر</li>
                <li onclick="switchTab('spam')">الهجوم والسبام</li>
            </ul>
        </div>
        <div class="main-content">
            <div id="targetTab" class="tab-content">
                <h3>إعدادات الاتصال</h3>
                <div class="form-group">
                    <label>نوع التوكن:</label>
                    <select id="tokenType">
                        <option value="bot">Bot Token</option>
                        <option value="user">Account Token</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>التوكن:</label>
                    <input type="password" id="tokenInput" placeholder="أدخل التوكن هنا">
                </div>
                <div class="form-group">
                    <label>معرف السيرفر (Server ID):</label>
                    <input type="text" id="guildIdInput" placeholder="Server ID">
                </div>
                <div class="form-group">
                    <label>الاسم المستهدف للروم/الرتب:</label>
                    <input type="text" id="targetNameInput" placeholder="الاسم المطلوب">
                </div>
                <button class="btn" onclick="connectServer()">اتصال وتنفيذ العمليات</button>
            </div>

            <div id="spamTab" class="tab-content hidden">
                <h3>السبام السريع والتحكم الشامل</h3>
                <div class="form-group">
                    <label>رسالة السبام (Webhook Spam):</label>
                    <input type="text" id="spamMessageInput" placeholder="اكتب رسالة السبام هنا">
                </div>
                <button class="btn danger" onclick="startNukeAndSpam()">بدء التدمير والسبام الخارق</button>
                <div id="logConsole" class="console"></div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
